<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>baby_menu wordmark</title>
<link rel="stylesheet" href="card.css">
<style>
  .lockup {
    background: var(--bg-card);
    border: 1px solid var(--line-faint);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .wm {
    font-family: var(--font-mono);
    font-weight: var(--weight-light);
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--ink-strong);
  }
  .wm .sep { color: var(--signal-live); }
  .wm .caret {
    display: inline-block;
    width: 14px; height: 28px;
    background: var(--ink-strong);
    margin-left: 6px;
    vertical-align: -4px;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .tray { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: var(--fs-xs); }
  .glyph {
    width: 16px; height: 16px;
    border: 1px solid var(--ink-300);
    border-radius: 2px;
    display: inline-grid;
    place-items: center;
    color: var(--ink-200);
    font-size: 11px;
    font-weight: var(--weight-med);
  }
</style>
</head>
<body>
<div class="card">
  <span class="label">wordmark</span>
  <div class="lockup">
    <div class="top">
      <div class="wm">baby<span class="sep">_</span>menu<span class="caret"></span></div>
    </div>
  </div>
  <div class="tray">
    <span class="glyph">b</span>
    <span>macOS tray glyph · template-rendered monochrome PNG</span>
  </div>
</div>
</body>
</html>
