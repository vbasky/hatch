[package]
name = "hatch"
version = "0.1.24"
description = "Menu-bar app that writes its own widgets"
authors = ["Kun Chen"]
edition = "2021"

[lib]
name = "hatch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc = { version = "0.147", features = ["semantic", "transformer", "codegen"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = { version = "0.9", features = ["macro", "loader", "array-buffer", "either"] }
ureq = { version = "2", features = ["tls"] }
libc = "0.2"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSImage",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "objc2-core-foundation",
] }

[profile.release]
lto = true
codegen-units = 1
