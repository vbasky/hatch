name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contract types are up to date
        run: |
          set -eu
          pnpm generate:contracts
          if ! git diff --quiet -- extensions/hatch-env.d.ts; then
            {
              echo "::error file=extensions/hatch-env.d.ts::Generated contract types are out of date."
              echo "extensions/hatch-env.d.ts no longer matches src/shared/contracts.ts."
              echo "Run 'pnpm generate:contracts' locally and commit the result."
              echo
              git --no-pager diff -- extensions/hatch-env.d.ts
            } >&2
            exit 1
          fi
          echo "Generated contract types are up to date."

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: cargo check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Build and prepare Tauri resources
        run: pnpm install --frozen-lockfile && node scripts/build.mjs && node scripts/prepare-tauri-resources.mjs
      - name: Check Tauri host
        run: cargo check --manifest-path src-tauri/Cargo.toml
